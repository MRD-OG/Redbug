<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbug Oscilloscope</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #1a2a1a;
            background: #0d0d14;
        }

        .title {
            font-size: 1.4em;
            color: #ff4444;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: all 0.3s;
        }

        .status-dot.connected {
            background: #55ff55;
            box-shadow: 0 0 6px rgba(85, 255, 85, 0.6);
        }

        #scopes {
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scope-section {
            background: #0d1117;
            border: 1px solid #1a2a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        .scope-header {
            padding: 10px 16px;
            font-size: 0.85em;
            color: #ffaa00;
            border-bottom: 1px solid #1a2a1a;
            background: #0f1218;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scope-header .bus-badge {
            font-size: 0.85em;
            color: #55ffff;
            opacity: 0.7;
        }

        .scope-chart {
            padding: 12px 16px;
            height: 240px;
            position: relative;
        }

        .scope-chart::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05) 0px,
                rgba(0, 0, 0, 0.05) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
        }

        .bus-readout {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 12px 16px;
            border-top: 1px solid #1a2a1a;
            background: #0a0e13;
        }

        .bus-value-main {
            font-size: 2.2em;
            font-weight: bold;
            color: #55ffff;
            text-shadow: 0 0 12px rgba(85, 255, 255, 0.3);
        }

        .bus-value-dec {
            font-size: 1.1em;
            color: #888;
        }

        .bus-value-bits {
            font-size: 0.85em;
            color: #555;
            letter-spacing: 1px;
        }

        .bus-chart {
            padding: 8px 16px 12px;
            height: 160px;
            position: relative;
        }

        .scope-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #1a2a1a;
        }

        .probe-card {
            background: #0a0e13;
            border: 1px solid #1a2a1a;
            border-radius: 5px;
            padding: 8px 14px;
            min-width: 140px;
            flex: 1;
        }

        .probe-label {
            font-size: 0.75em;
            opacity: 0.5;
            margin-bottom: 2px;
        }

        .probe-value {
            font-size: 1.8em;
            font-weight: bold;
            line-height: 1.1;
        }

        .probe-loc {
            font-size: 0.65em;
            opacity: 0.35;
            margin-top: 2px;
        }

        .probe-bar {
            height: 3px;
            background: #1a1a2e;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .probe-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.2s ease;
        }

        .no-probes {
            text-align: center;
            padding: 80px 24px;
            color: #444;
            font-size: 1.05em;
            line-height: 2;
        }

        .no-probes code {
            color: #55ffff;
            background: #111;
            padding: 2px 8px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">&#9889; REDBUG OSCILLOSCOPE</div>
        <div class="status">
            <span id="status-text">Connecting...</span>
            <div id="status-dot" class="status-dot"></div>
        </div>
    </div>

    <div id="scopes"></div>

    <div id="no-probes" class="no-probes">
        No probes active.<br>
        <code>/rb probe</code> &mdash; toggle probe mode, right-click redstone<br>
        <code>/rb probe 2</code> &mdash; separate graph<br>
        <code>/rb bus 1 sort y_asc</code> &mdash; interpret as bus (LSB = lowest Y)<br>
        <code>/rb bus 1 format hex 8</code> &mdash; display as hex, 8-bit words
    </div>

    <script>
        var MAX_HISTORY = 60;
        var scopes = {}; // id -> { probeChart, busChart, element }

        function makeProbeChartConfig() {
            return {
                type: 'line',
                data: { labels: seq(MAX_HISTORY), datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    interaction: { intersect: false, mode: 'index' },
                    scales: {
                        y: {
                            min: 0, max: 15,
                            grid: { color: 'rgba(0,255,0,0.07)' },
                            ticks: { color: '#444', stepSize: 5, font: { family: "'Courier New',monospace", size: 11 } },
                            border: { color: '#1a2a1a' }
                        },
                        x: {
                            grid: { color: 'rgba(0,255,0,0.04)' },
                            ticks: { display: false },
                            border: { color: '#1a2a1a' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#888', font: { family: "'Courier New',monospace", size: 10 }, usePointStyle: true, pointStyle: 'line', padding: 12 }
                        },
                        tooltip: { backgroundColor: '#1a1a2e', titleColor: '#aaa', bodyColor: '#eee', borderColor: '#333', borderWidth: 1 }
                    },
                    elements: { line: { tension: 0.2, borderWidth: 2 }, point: { radius: 0, hoverRadius: 3 } }
                }
            };
        }

        function makeBusChartConfig(maxValue) {
            return {
                type: 'line',
                data: { labels: seq(MAX_HISTORY), datasets: [] },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    interaction: { intersect: false, mode: 'index' },
                    scales: {
                        y: {
                            min: 0, max: maxValue || 255,
                            grid: { color: 'rgba(85,255,255,0.06)' },
                            ticks: { color: '#444', font: { family: "'Courier New',monospace", size: 10 },
                                callback: function(v) { return '0x' + v.toString(16).toUpperCase(); } },
                            border: { color: '#1a2a1a' }
                        },
                        x: {
                            grid: { color: 'rgba(85,255,255,0.03)' },
                            ticks: { display: false },
                            border: { color: '#1a2a1a' }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: '#1a1a2e', bodyColor: '#55ffff', borderColor: '#333', borderWidth: 1,
                            callbacks: { label: function(ctx) { return 'Bus: ' + ctx.parsed.y; } } }
                    },
                    elements: { line: { tension: 0, borderWidth: 2, stepped: 'before' }, point: { radius: 0, hoverRadius: 3 } }
                }
            };
        }

        function seq(n) { return Array.from({ length: n }, function(_, i) { return i; }); }

        function createScope(id) {
            var container = document.getElementById('scopes');
            var section = document.createElement('div');
            section.className = 'scope-section';
            section.id = 'scope-' + id;
            section.innerHTML =
                '<div class="scope-header"><span>SCOPE ' + id + '</span><span class="bus-badge" id="bus-badge-' + id + '"></span></div>' +
                '<div class="scope-chart"><canvas id="pcanvas-' + id + '"></canvas></div>' +
                '<div id="bus-readout-' + id + '" class="bus-readout" style="display:none;"></div>' +
                '<div id="bus-chart-wrap-' + id + '" class="bus-chart" style="display:none;"><canvas id="bcanvas-' + id + '"></canvas></div>' +
                '<div class="scope-cards" id="cards-' + id + '"></div>';

            // Insert sorted
            var inserted = false;
            for (var i = 0; i < container.children.length; i++) {
                if (parseInt(container.children[i].id.replace('scope-', '')) > parseInt(id)) {
                    container.insertBefore(section, container.children[i]);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) container.appendChild(section);

            var probeChart = new Chart(document.getElementById('pcanvas-' + id).getContext('2d'), makeProbeChartConfig());
            var busChart = new Chart(document.getElementById('bcanvas-' + id).getContext('2d'), makeBusChartConfig(255));

            scopes[id] = { probeChart: probeChart, busChart: busChart, element: section, lastMaxValue: 255 };
        }

        function removeScope(id) {
            if (scopes[id]) {
                scopes[id].probeChart.destroy();
                scopes[id].busChart.destroy();
                scopes[id].element.remove();
                delete scopes[id];
            }
        }

        function updateDisplay(data) {
            var channels = data.channels || {};
            var activeIds = {};
            var hasAny = false;
            for (var id in channels) { activeIds[id] = true; hasAny = true; }

            for (var id in scopes) { if (!activeIds[id]) removeScope(id); }

            var sortedIds = Object.keys(channels).sort(function(a, b) { return a - b; });
            for (var i = 0; i < sortedIds.length; i++) {
                var id = sortedIds[i];
                if (!scopes[id]) createScope(id);
                updateScope(id, channels[id]);
            }

            document.getElementById('no-probes').style.display = hasAny ? 'none' : 'block';
        }

        function updateScope(id, ch) {
            var probes = ch.probes || [];
            var bus = ch.bus || null;
            var s = scopes[id];

            // Probe chart
            s.probeChart.data.datasets = probes.map(function(probe) {
                var h = probe.history || [];
                var padded = new Array(Math.max(0, MAX_HISTORY - h.length)).fill(null).concat(h);
                return {
                    label: probe.player + ' P' + probe.index + ' ' + probe.location,
                    data: padded,
                    borderColor: probe.color,
                    backgroundColor: probe.color + '12',
                    fill: true,
                    spanGaps: false
                };
            });
            s.probeChart.update();

            // Bus badge
            var badge = document.getElementById('bus-badge-' + id);
            var readout = document.getElementById('bus-readout-' + id);
            var busWrap = document.getElementById('bus-chart-wrap-' + id);

            if (bus) {
                badge.textContent = 'BUS: ' + bus.sort + ' / ' + bus.format + (bus.format === 'hex' ? ' ' + bus.wordSize + 'b' : '') + ' (' + bus.bitCount + '-bit)';
                readout.style.display = 'flex';
                busWrap.style.display = 'block';

                readout.innerHTML =
                    '<span class="bus-value-main">' + escHtml(bus.display) + '</span>' +
                    '<span class="bus-value-dec">= ' + bus.decimal + '</span>' +
                    '<span class="bus-value-bits">' + bus.bits + 'b</span>';

                // Bus value chart
                var maxVal = bus.maxValue || 255;
                if (maxVal !== s.lastMaxValue) {
                    s.busChart.options.scales.y.max = maxVal;
                    s.lastMaxValue = maxVal;
                }

                var bh = bus.history || [];
                var bPadded = new Array(Math.max(0, MAX_HISTORY - bh.length)).fill(null).concat(bh);
                s.busChart.data.datasets = [{
                    label: 'Bus Value',
                    data: bPadded,
                    borderColor: '#55ffff',
                    backgroundColor: '#55ffff10',
                    fill: true,
                    spanGaps: false
                }];
                s.busChart.update();
            } else {
                badge.textContent = '';
                readout.style.display = 'none';
                busWrap.style.display = 'none';
                s.busChart.data.datasets = [];
                s.busChart.update();
            }

            // Probe cards
            document.getElementById('cards-' + id).innerHTML = probes.map(function(probe) {
                var pct = (probe.level / 15 * 100).toFixed(0);
                var bit = bus ? (probe.level > 0 ? '1' : '0') : '';
                var bitHtml = bit ? '<span style="color:#55ffff;float:right;font-size:0.8em;opacity:0.6;">' + bit + '</span>' : '';
                return '<div class="probe-card" style="border-color:' + probe.color + '25;">' +
                    '<div class="probe-label" style="color:' + probe.color + ';">' +
                    probe.player + ' &middot; P' + probe.index + bitHtml + '</div>' +
                    '<div class="probe-value" style="color:' + probe.color + ';">' + probe.level + '</div>' +
                    '<div class="probe-loc">' + probe.location + '</div>' +
                    '<div class="probe-bar"><div class="probe-bar-fill" style="width:' + pct + '%;background:' + probe.color + ';"></div></div></div>';
            }).join('');
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // SSE
        var source;
        function connect() {
            source = new EventSource('/api/probes');
            source.onopen = function() {
                document.getElementById('status-text').textContent = 'Connected';
                document.getElementById('status-dot').classList.add('connected');
            };
            source.onmessage = function(event) {
                try { updateDisplay(JSON.parse(event.data)); } catch(e) { console.error('Parse:', e); }
            };
            source.onerror = function() {
                document.getElementById('status-text').textContent = 'Disconnected';
                document.getElementById('status-dot').classList.remove('connected');
                source.close();
                setTimeout(connect, 2000);
            };
        }
        connect();
    </script>
</body>
</html>
